naftiko: 1.0.0-alpha2
info:
  label: JFrog Artifactory Docker Registry API — Base
  description: 'JFrog Artifactory Docker Registry API — Base. 1 operations. Lead operation: JFrog Artifactory API Version
    Check. Self-contained Naftiko capability covering one Artifactory business surface.'
  tags:
  - Artifactory
  - Base
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARTIFACTORY_API_KEY: ARTIFACTORY_API_KEY
capability:
  consumes:
  - type: http
    namespace: docker-registry-base
    baseUri: https://{server}
    description: JFrog Artifactory Docker Registry API — Base business capability. Self-contained, no shared references.
    resources:
    - name: v2
      path: /v2/
      operations:
      - name: checkapiversion
        method: GET
        description: JFrog Artifactory API Version Check
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ARTIFACTORY_API_KEY}}'
  exposes:
  - type: rest
    namespace: docker-registry-base-rest
    port: 8080
    description: REST adapter for JFrog Artifactory Docker Registry API — Base. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v2
      name: v2
      description: REST surface for v2.
      operations:
      - method: GET
        name: checkapiversion
        description: JFrog Artifactory API Version Check
        call: docker-registry-base.checkapiversion
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: docker-registry-base-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Artifactory Docker Registry API — Base. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: jfrog-artifactory-api-version-check
      description: JFrog Artifactory API Version Check
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-registry-base.checkapiversion
      outputParameters:
      - type: object
        mapping: $.
