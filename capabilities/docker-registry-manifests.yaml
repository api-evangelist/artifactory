naftiko: 1.0.0-alpha2
info:
  label: JFrog Artifactory Docker Registry API — Manifests
  description: 'JFrog Artifactory Docker Registry API — Manifests. 3 operations. Lead operation: JFrog Artifactory Get Image
    Manifest. Self-contained Naftiko capability covering one Artifactory business surface.'
  tags:
  - Artifactory
  - Manifests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARTIFACTORY_API_KEY: ARTIFACTORY_API_KEY
capability:
  consumes:
  - type: http
    namespace: docker-registry-manifests
    baseUri: https://{server}
    description: JFrog Artifactory Docker Registry API — Manifests business capability. Self-contained, no shared references.
    resources:
    - name: v2-name-manifests-reference
      path: /v2/{name}/manifests/{reference}
      operations:
      - name: getmanifest
        method: GET
        description: JFrog Artifactory Get Image Manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Accept
          in: header
          type: string
          description: Acceptable manifest media types
      - name: putmanifest
        method: PUT
        description: JFrog Artifactory Push Image Manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletemanifest
        method: DELETE
        description: JFrog Artifactory Delete Image Manifest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: reference
          in: path
          type: string
          description: Manifest digest
          required: true
    authentication:
      type: bearer
      token: '{{env.ARTIFACTORY_API_KEY}}'
  exposes:
  - type: rest
    namespace: docker-registry-manifests-rest
    port: 8080
    description: REST adapter for JFrog Artifactory Docker Registry API — Manifests. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v2/{name}/manifests/{reference}
      name: v2-name-manifests-reference
      description: REST surface for v2-name-manifests-reference.
      operations:
      - method: GET
        name: getmanifest
        description: JFrog Artifactory Get Image Manifest
        call: docker-registry-manifests.getmanifest
        with:
          Accept: rest.Accept
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: putmanifest
        description: JFrog Artifactory Push Image Manifest
        call: docker-registry-manifests.putmanifest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletemanifest
        description: JFrog Artifactory Delete Image Manifest
        call: docker-registry-manifests.deletemanifest
        with:
          reference: rest.reference
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: docker-registry-manifests-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Artifactory Docker Registry API — Manifests. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: jfrog-artifactory-get-image-manifest
      description: JFrog Artifactory Get Image Manifest
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: docker-registry-manifests.getmanifest
      with:
        Accept: tools.Accept
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-push-image-manifest
      description: JFrog Artifactory Push Image Manifest
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: docker-registry-manifests.putmanifest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-delete-image-manifest
      description: JFrog Artifactory Delete Image Manifest
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: docker-registry-manifests.deletemanifest
      with:
        reference: tools.reference
      outputParameters:
      - type: object
        mapping: $.
