naftiko: 1.0.0-alpha2
info:
  label: JFrog Artifactory REST API — Replication
  description: 'JFrog Artifactory REST API — Replication. 3 operations. Lead operation: JFrog Artifactory Get Replication
    Configuration. Self-contained Naftiko capability covering one Artifactory business surface.'
  tags:
  - Artifactory
  - Replication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARTIFACTORY_API_KEY: ARTIFACTORY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-replication
    baseUri: https://{server}/artifactory
    description: JFrog Artifactory REST API — Replication business capability. Self-contained, no shared references.
    resources:
    - name: api-replications-repoKey
      path: /api/replications/{repoKey}
      operations:
      - name: getreplicationconfig
        method: GET
        description: JFrog Artifactory Get Replication Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createorreplacereplication
        method: PUT
        description: JFrog Artifactory Create or Replace Replication
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletereplication
        method: DELETE
        description: JFrog Artifactory Delete Replication
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ARTIFACTORY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-replication-rest
    port: 8080
    description: REST adapter for JFrog Artifactory REST API — Replication. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/replications/{repokey}
      name: api-replications-repokey
      description: REST surface for api-replications-repoKey.
      operations:
      - method: GET
        name: getreplicationconfig
        description: JFrog Artifactory Get Replication Configuration
        call: rest-replication.getreplicationconfig
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: createorreplacereplication
        description: JFrog Artifactory Create or Replace Replication
        call: rest-replication.createorreplacereplication
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletereplication
        description: JFrog Artifactory Delete Replication
        call: rest-replication.deletereplication
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-replication-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Artifactory REST API — Replication. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: jfrog-artifactory-get-replication-configuration
      description: JFrog Artifactory Get Replication Configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-replication.getreplicationconfig
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-create-replace-replication
      description: JFrog Artifactory Create or Replace Replication
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rest-replication.createorreplacereplication
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-delete-replication
      description: JFrog Artifactory Delete Replication
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: rest-replication.deletereplication
      outputParameters:
      - type: object
        mapping: $.
