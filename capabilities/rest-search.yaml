naftiko: 1.0.0-alpha2
info:
  label: JFrog Artifactory REST API — Search
  description: 'JFrog Artifactory REST API — Search. 6 operations. Lead operation: JFrog Artifactory Artifact Search (Quick
    Search). Self-contained Naftiko capability covering one Artifactory business surface.'
  tags:
  - Artifactory
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ARTIFACTORY_API_KEY: ARTIFACTORY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-search
    baseUri: https://{server}/artifactory
    description: JFrog Artifactory REST API — Search business capability. Self-contained, no shared references.
    resources:
    - name: api-search-artifact
      path: /api/search/artifact
      operations:
      - name: searchartifactbyname
        method: GET
        description: JFrog Artifactory Artifact Search (Quick Search)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Artifact name or partial name to search for
          required: true
        - name: repos
          in: query
          type: string
          description: Comma-separated list of repository keys to search in
    - name: api-search-checksum
      path: /api/search/checksum
      operations:
      - name: searchbychecksum
        method: GET
        description: JFrog Artifactory Checksum Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sha1
          in: query
          type: string
          description: SHA-1 checksum value
        - name: sha256
          in: query
          type: string
          description: SHA-256 checksum value
        - name: md5
          in: query
          type: string
          description: MD5 checksum value
        - name: repos
          in: query
          type: string
          description: Comma-separated list of repository keys to search in
    - name: api-search-creation
      path: /api/search/creation
      operations:
      - name: searchbycreationdate
        method: GET
        description: JFrog Artifactory Creation Date Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          description: Start date in milliseconds since epoch
        - name: to
          in: query
          type: integer
          description: End date in milliseconds since epoch
        - name: repos
          in: query
          type: string
          description: Comma-separated list of repository keys to search in
    - name: api-search-dates
      path: /api/search/dates
      operations:
      - name: searchbydate
        method: GET
        description: JFrog Artifactory Date-based Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          description: Start date in milliseconds since epoch
        - name: to
          in: query
          type: integer
          description: End date in milliseconds since epoch
        - name: repos
          in: query
          type: string
          description: Comma-separated list of repository keys to search in
        - name: dateFields
          in: query
          type: string
          description: Date fields to search on (created, lastModified, lastDownloaded)
    - name: api-search-gavc
      path: /api/search/gavc
      operations:
      - name: searchbygavc
        method: GET
        description: JFrog Artifactory GAVC Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: g
          in: query
          type: string
          description: Maven groupId
        - name: a
          in: query
          type: string
          description: Maven artifactId
        - name: v
          in: query
          type: string
          description: Maven version
        - name: c
          in: query
          type: string
          description: Maven classifier
        - name: repos
          in: query
          type: string
          description: Comma-separated list of repository keys to search in
    - name: api-search-prop
      path: /api/search/prop
      operations:
      - name: searchbyproperty
        method: GET
        description: JFrog Artifactory Property Search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: repos
          in: query
          type: string
          description: Comma-separated list of repository keys to search in
    authentication:
      type: bearer
      token: '{{env.ARTIFACTORY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-search-rest
    port: 8080
    description: REST adapter for JFrog Artifactory REST API — Search. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/search/artifact
      name: api-search-artifact
      description: REST surface for api-search-artifact.
      operations:
      - method: GET
        name: searchartifactbyname
        description: JFrog Artifactory Artifact Search (Quick Search)
        call: rest-search.searchartifactbyname
        with:
          name: rest.name
          repos: rest.repos
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/search/checksum
      name: api-search-checksum
      description: REST surface for api-search-checksum.
      operations:
      - method: GET
        name: searchbychecksum
        description: JFrog Artifactory Checksum Search
        call: rest-search.searchbychecksum
        with:
          sha1: rest.sha1
          sha256: rest.sha256
          md5: rest.md5
          repos: rest.repos
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/search/creation
      name: api-search-creation
      description: REST surface for api-search-creation.
      operations:
      - method: GET
        name: searchbycreationdate
        description: JFrog Artifactory Creation Date Search
        call: rest-search.searchbycreationdate
        with:
          from: rest.from
          to: rest.to
          repos: rest.repos
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/search/dates
      name: api-search-dates
      description: REST surface for api-search-dates.
      operations:
      - method: GET
        name: searchbydate
        description: JFrog Artifactory Date-based Search
        call: rest-search.searchbydate
        with:
          from: rest.from
          to: rest.to
          repos: rest.repos
          dateFields: rest.dateFields
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/search/gavc
      name: api-search-gavc
      description: REST surface for api-search-gavc.
      operations:
      - method: GET
        name: searchbygavc
        description: JFrog Artifactory GAVC Search
        call: rest-search.searchbygavc
        with:
          g: rest.g
          a: rest.a
          v: rest.v
          c: rest.c
          repos: rest.repos
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/search/prop
      name: api-search-prop
      description: REST surface for api-search-prop.
      operations:
      - method: GET
        name: searchbyproperty
        description: JFrog Artifactory Property Search
        call: rest-search.searchbyproperty
        with:
          repos: rest.repos
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for JFrog Artifactory REST API — Search. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: jfrog-artifactory-artifact-search-quick
      description: JFrog Artifactory Artifact Search (Quick Search)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.searchartifactbyname
      with:
        name: tools.name
        repos: tools.repos
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-checksum-search
      description: JFrog Artifactory Checksum Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.searchbychecksum
      with:
        sha1: tools.sha1
        sha256: tools.sha256
        md5: tools.md5
        repos: tools.repos
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-creation-date-search
      description: JFrog Artifactory Creation Date Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.searchbycreationdate
      with:
        from: tools.from
        to: tools.to
        repos: tools.repos
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-date-based-search
      description: JFrog Artifactory Date-based Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.searchbydate
      with:
        from: tools.from
        to: tools.to
        repos: tools.repos
        dateFields: tools.dateFields
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-gavc-search
      description: JFrog Artifactory GAVC Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.searchbygavc
      with:
        g: tools.g
        a: tools.a
        v: tools.v
        c: tools.c
        repos: tools.repos
      outputParameters:
      - type: object
        mapping: $.
    - name: jfrog-artifactory-property-search
      description: JFrog Artifactory Property Search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-search.searchbyproperty
      with:
        repos: tools.repos
      outputParameters:
      - type: object
        mapping: $.
