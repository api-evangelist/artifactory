  - FOCUS
description: FOCUS-aligned FinOps for JFrog Artifactory — tiered SaaS subscription with included storage
  consumption plus a per-GB overage meter on a tiered overage schedule, alongside annual self-managed
  per-server subscriptions.
sources:
  - https://jfrog.com/pricing/
  - https://jfrog.com/help/
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: JFrog Ltd.
serviceCategory: Developer Tools / Artifact Management
billingModel:
  pricingCategory: Tiered Subscription + Usage Overage
  billingFrequency: Monthly (SaaS) / Annual (Self-Managed)
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
    - Credit
focusColumns:
  ServiceName: JFrog Artifactory
  ServiceCategory: Developer Tools
  ServiceSubcategory: Artifact Repository
  ProviderName: JFrog
  PublisherName: JFrog Ltd.
  InvoiceIssuerName: JFrog Ltd.
  BillingCurrency: USD
  PricingCategory: Tiered Subscription + Usage Overage
  PricingUnit: GB-month
  ChargeCategory: Usage
meters:
  - name: subscription_fee
    description: Monthly or annual subscription fee for the selected Artifactory plan
    unit: month
    aggregation: sum
    dimensions:
      - plan
      - deployment_model
  - name: storage_consumption
    description: GB of artifact storage consumed (counts toward included base before overage)
    unit: GB-month
    aggregation: max
    dimensions:
      - plan
      - region
  - name: storage_overage
    description: GB of storage above the plan's included base, billed on the tiered overage schedule
    unit: GB
    aggregation: sum
    dimensions:
      - plan
      - region
      - tier_band
  - name: data_transfer
    description: Network data transfer associated with artifact downloads where charged
    unit: GB
    aggregation: sum
    dimensions:
      - direction
      - region
  - name: server_count
    description: Number of self-managed servers under license
    unit: server
    aggregation: max
    dimensions:
      - plan
principles:
  - name: Visibility
    description: Use the JFrog Platform Admin console (Reports → Storage Summary, Usage by Repository)
      and the System REST API (api/storageinfo, api/repositories/{key}/usage) to surface monthly storage
      consumption and projected overage before invoice close.
  - name: Allocation
    description: Tag spend by repository and project using Artifactory's repository-level metadata
      and properties; map repositories to cost centers in the consuming team's CMDB or via JFrog
      labels.
  - name: Optimization
    description: Reduce storage overage through repository cleanup policies (max-unique-snapshots,
      retention rules), generic-repo deduplication, and binary cleanup with JFrog's automated cleanup
      features (Enterprise X+). Use Tiered Storage to push cold artifacts to cheaper backends.
  - name: Accountability
    description: Assign repository ownership and surface monthly storage charts to repo owners; use
      JFrog Insight or exported CSV reports to feed showback. Trigger alerts when projected storage
      crosses 80% of the included plan base.
maintainers:
