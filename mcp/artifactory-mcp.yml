source: https://github.com/jfrog/jfrog-mcp-server
description: JFrog operates an official, remotely-hosted MCP server for the JFrog Platform (which Artifactory
  anchors). It is reached at https://<JFROG_PLATFORM_URL>/mcp and authenticated with OAuth, so no API-key
  management or local install is required. The earlier community/experimental github.com/jfrog/mcp-jfrog
  repo is deprecated in favor of this hosted server. Tool list captured verbatim from the server's TOOLS.md
  reference; tools span Artifactory plus the surrounding Platform services (Access, Distribution, Evidence,
  Xray/Security, Curation, AppTrust, Workers).
server:
  name: jfrog
  transport: http
  url: https://<JFROG_PLATFORM_URL>/mcp
  auth: oauth2
  hosted: true
  blog: https://jfrog.com/blog/introducing-jfrog-mcp-server/
  docs: https://docs.jfrog.com/integrations/docs/jfrog-mcp-server
deprecated_predecessor:
  name: mcp-jfrog
  url: https://github.com/jfrog/mcp-jfrog
  note: Experimental predecessor; no further features/fixes/security updates.
