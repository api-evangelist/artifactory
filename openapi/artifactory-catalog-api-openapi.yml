openapi: 3.2.0
info:
  title: JFrog Artifactory Docker Registry Catalog API
  description: Docker Registry HTTP API V2 implementation in JFrog Artifactory. Provides endpoints for managing Docker images including pushing and pulling layers and manifests, listing tags, and managing repositories. Artifactory acts as a fully compliant Docker registry with additional features like promotion and property management.
  version: v2
  contact:
    name: JFrog Support
    url: https://jfrog.com/support/
    email: support@jfrog.com
  license:
    name: Proprietary
    url: https://jfrog.com/terms-of-service/
  termsOfService: https://jfrog.com/terms-of-service/
servers:
- url: https://{server}
  description: JFrog Artifactory Docker Registry
  variables:
    server:
      default: myserver.jfrog.io
      description: Your JFrog Platform deployment URL
security:
- BearerAuth: []
- BasicAuth: []
tags:
- name: Catalog
  description: List available repositories
paths:
  /v2/_catalog:
    get:
      operationId: listRepositories
      summary: JFrog Artifactory List Repositories
      description: Returns a list of repositories available in the registry.
      tags:
      - Catalog
      parameters:
      - name: n
        in: query
        description: Maximum number of entries to return
        schema:
          type: integer
      - name: last
        in: query
        description: Last repository name for pagination
        schema:
          type: string
      responses:
        '200':
          description: Repository list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryCatalog'
          headers:
            Link:
              description: RFC5988 link to next page of results
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    RepositoryCatalog:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: string
          description: List of repository names available
          example:
          - library/nginx
          - library/alpine
          - myproject/myimage
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: Error code
              message:
                type: string
                description: Error message
              detail:
                type: string
                description: Additional error details
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Docker token authentication. Obtain a token from the authentication service endpoint returned in the WWW-Authenticate header.
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using Artifactory credentials
externalDocs:
  description: JFrog Artifactory Docker Registry Documentation
  url: https://jfrog.com/help/r/jfrog-artifactory-documentation/docker-registry
