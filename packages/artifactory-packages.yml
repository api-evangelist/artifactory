method: searched
source: https://docs.jfrog.com/integrations/docs/sdks
description: >-
  First-party JFrog client libraries, CLI binaries, and tooling for interacting
  with JFrog Artifactory (and the wider JFrog Platform). Verified against the
  public package registries and the JFrog GitHub org (github.com/jfrog). Registry
  HTTP status recorded at fetch time. JFrog does not publish a dedicated Python
  or Java Artifactory SDK on PyPI/Maven under its own name (pypi 'jfrog' and
  'jfrog-cli' return 404); Go is the first-party client language, and language-
  native workflows are handled through the JFrog CLI's package-manager wrappers.
packages:
