    url: https://pkg.go.dev/github.com/jfrog/jfrog-client-go
    source: https://github.com/jfrog/jfrog-client-go
    install: go get github.com/jfrog/jfrog-client-go
    official: true
    note: >-
      The official Go client library — Go APIs for Artifactory, Xray, and
      Distribution; used as a dependency by the JFrog CLI itself.
