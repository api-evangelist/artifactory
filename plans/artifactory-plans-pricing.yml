specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: JFrog Artifactory
providerId: artifactory
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Artifacts
  - DevOps
  - CI/CD
  - Docker Registry
  - Package Management
  - Repository
description: JFrog prices Artifactory by SaaS subscription tier with included base consumption (storage)
  plus tiered overage on storage. Self-managed plans are sold annually by server count. Per-API-call
  pricing is not published; APIs are included with the platform subscription.
sources:
  - https://jfrog.com/pricing/
plans:
  - id: artifactory-pro-saas
    name: Pro (SaaS)
    type: subscription
    description: SaaS Artifactory entry tier including 25 GB base consumption.
    entries:
      - label: Subscription
        name: subscription_pro
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: $50/month (limited-time, regular $150/month)
        userMultiplied: false
      - label: Included Storage
        name: storage_included
        type: quota
        metric: gb
        limit: 25
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Storage Overage
        name: storage_overage
        type: tiered
        metric: gb
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: $0.33–$1.25/GB (tiered by volume)
        userMultiplied: false
    elements:
      - name: Universal Binary Repository
      - name: Container Registry
      - name: ML Model Registry
      - name: CI/CD Integration
      - name: Community Support
  - id: artifactory-enterprise-x-saas
    name: Enterprise X (SaaS)
    type: subscription
    description: SaaS Artifactory tier with HA, federation, SSO/SAML, SCA scanning, and 24/7 SLA support.
      Includes 125 GB base consumption.
    entries:
      - label: Subscription
        name: subscription_ent_x
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: starting at $950/month
        userMultiplied: false
      - label: Included Storage
        name: storage_included
        type: quota
        metric: gb
        limit: 125
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Storage Overage
        name: storage_overage
        type: tiered
        metric: gb
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: $0.33–$1.25/GB (tiered by volume)
        userMultiplied: false
    elements:
      - name: High Availability (99.9% Uptime)
      - name: Artifact Federation
      - name: Automated Cleanup
      - name: SSO/SAML
      - name: GitHub Integration
      - name: SCA Scanning
      - name: ML Model Security
      - name: 24/7 SLA Support
  - id: artifactory-enterprise-plus-saas
    name: Enterprise+ (SaaS)
    type: enterprise
    description: SaaS tier with multisite federation, distribution, advanced network topologies, AppTrust
      governance, and 24/7 high-touch support with technical account lead.
    entries:
      - label: Subscription
        name: subscription_ent_plus
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
      - label: Included Storage
        name: storage_included
        type: quota
        metric: gb
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Multisite Federation
      - name: Distribution
      - name: Advanced Network Topologies
      - name: Release Integrity
      - name: AppTrust Governance
      - name: 24/7 High Touch Support
      - name: Technical Account Lead
  - id: artifactory-pro-x-self-managed
    name: Pro X (Self-Managed)
    type: subscription
    description: Self-managed Artifactory annual subscription, sold per server.
    entries:
