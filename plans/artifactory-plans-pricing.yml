        name: subscription_self_ent_x
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: starting at $51,000/year (3 servers)
        userMultiplied: false
    elements:
      - name: Self-Hosted Deployment
      - name: 3-Server Cluster
      - name: HA Configuration
  - id: artifactory-enterprise-plus-self-managed
    name: Enterprise+ (Self-Managed)
    type: enterprise
